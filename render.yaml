# CodeGuard AI — Render Blueprint Deployment Specification
services:
  - type: web
    name: codeguard-ai
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://codeguard-lhs.onrender.com,https://codeguard-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: codeguard-postgres
          property: connectionString

databases:
  - name: codeguard-postgres
    plan: starter
    region: oregon
    databaseName: codeguard_db
    user: codeguard_user
